namespace: shopnow

backend:
  replicaCount: 2

  image:
    repository: 651863679098.dkr.ecr.ap-south-1.amazonaws.com/shopnow-backend
    tag: "1.3"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

  env:
    PORT: "5000"

frontend:
  replicaCount: 2

  image:
    repository: 651863679098.dkr.ecr.ap-south-1.amazonaws.com/shopnow-frontend
    tag: "1.3"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80
