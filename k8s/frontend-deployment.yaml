apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: shopnow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sonalip1234/shopnow-frontend:1.0
          ports:
            - containerPort: 80
